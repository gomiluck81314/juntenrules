<style>
:root{--bg:#f6f8fc;--card:#fff;--tx:#1b2438;--mu:#5d6882;--pri:#1e3a8a;--acc:#f59e0b;--bd:#e3e8f2;--do:#e8f6ee;--ng:#fdecec;--nt:#fff6e0;--hp:#e9f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1524;--card:#18203a;--tx:#e8ecf7;--mu:#9aa6c4;--pri:#8fb0ff;--bd:#2a3556;--do:#12301f;--ng:#3a1818;--nt:#3a2f10;--hp:#16264a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans SC",sans-serif}
a{color:inherit;text-decoration:none}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd{max-width:960px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{font-weight:800;color:var(--pri);font-size:20px}.logo small{display:block;font-size:11px;color:var(--mu);font-weight:600;margin-top:-4px}
.lang{display:flex;gap:4px}.lang button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
nav{max-width:960px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
nav a{white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--mu);font-weight:600}
nav a.on{background:var(--hp);color:var(--pri)}
main{max-width:960px;margin:auto;padding:20px 16px 40px;min-height:70vh}
.hero{background:linear-gradient(135deg,var(--pri),#3b63d6);color:#fff;border-radius:24px;padding:28px 22px}
.hero h1{margin:0 0 8px;font-size:clamp(22px,5vw,32px);line-height:1.3}.hero p{margin:0;opacity:.92}
.sub{color:var(--mu);margin:12px 4px}
.search{margin:18px 0}.search input{width:100%;padding:14px 18px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.search input:focus{outline:none;border-color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;display:block;transition:.15s}
.cat:hover{transform:translateY(-3px);box-shadow:0 8px 24px #1e3a8a22}
.cat .ic{font-size:34px}.cat b{display:block;font-size:18px;margin-top:6px}.cat span{color:var(--mu);font-size:14px}
h2{font-size:22px;margin:26px 0 10px}h3{font-size:16px;margin:0 0 8px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bg{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;text-align:center}
.bg small{color:var(--mu);font-weight:600}.bg div{font-size:clamp(28px,8vw,44px);font-weight:800;color:var(--pri);line-height:1.2}.bg em{font-style:normal;color:var(--mu);font-size:14px}
.sec{border-radius:18px;padding:16px 18px;margin:12px 0}.sec ul{margin:0;padding-left:20px}.sec li{margin:4px 0}
.do{background:var(--do)}.ng{background:var(--ng)}.nt{background:var(--nt)}.hp{background:var(--hp)}
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--bd);background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bd)}th{background:var(--hp);color:var(--pri);font-size:14px}tr:last-child td{border:0}td.t{font-weight:800;color:var(--pri);white-space:nowrap}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.fs{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px 18px}.fs b{display:block;color:var(--pri)}
.fs.a{border-color:#22a35a}.fs.b{border-color:var(--acc)}.fs.c{border-color:#e05252}
.ar{text-align:center;font-size:22px;color:var(--mu);line-height:1.2;margin:4px 0}
.res a{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:8px 0}.res small{color:var(--pri);font-weight:700}
footer{background:var(--card);border-top:1px solid var(--bd);padding:20px 16px 28px;color:var(--mu);font-size:13px;text-align:center}footer p{max-width:720px;margin:6px auto}
.tbn{display:flex;gap:8px;margin:14px 0 4px}.tbn button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:16px;cursor:pointer}.tbn button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ck{list-style:none;padding:0!important}.ck li{margin:6px 0}.ck label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer}.ck input{width:22px;height:22px;margin-top:3px;accent-color:#22a35a;flex:none}.ck input:checked+span{opacity:.5;text-decoration:line-through}
.ev{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px 20px;margin:14px 0}.ev h3{font-size:19px;margin:4px 0 10px;color:var(--pri)}.tag{background:var(--acc);color:#1b2438;border-radius:999px;font-size:12px;font-weight:800;padding:2px 10px}.ev dl{margin:0;display:grid;grid-template-columns:84px 1fr;gap:6px 12px}.ev dt{color:var(--mu);font-weight:700;font-size:14px}.ev dd{margin:0}
@media(max-width:520px){.big{grid-template-columns:1fr}}
